<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diccionario de Verbos</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #0F1B3D;
      --ink-soft: #46527A;
      --bg: #F2F4FB;
      --bg-2: #E4E8F6;
      --indigo: #4338CA;
      --indigo-d: #312E81;
      --orange: #C2410C;
      --orange-l: #EA580C;
      --red: #C81E4B;
      --red-soft: #FDE7EC;
      --teal: #0F766E;
      --teal-soft: #DDF4F0;
      --purple: #7E22CE;
      --purple-soft: #F3E8FF;
      --blue: #1D4ED8;
      --blue-soft: #E1EAFE;
      --green: #15803D;
      --green-soft: #DFF5E6;
      --card-bg: #FFFFFF;
      --muted: #6B7699;
      --border: #D9DEF0;
      --radius-lg: 1.6rem;
      --radius-md: 1.1rem;
      --shadow-card: 0 10px 30px -14px rgba(15,27,61,.28);
      --shadow-hover: 0 22px 44px -16px rgba(67,56,202,.38);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; font-size: 16px; }
    @media (min-width: 900px) { html { font-size: clamp(17px, 0.45vw + 12px, 28px); } }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Manrope', sans-serif;
      font-size: 1rem;
      min-height: 100vh;
      overflow-x: hidden;
      width: 100%;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 12% 8%, rgba(67,56,202,.14) 0%, transparent 42%),
        radial-gradient(circle at 92% 22%, rgba(234,88,12,.10) 0%, transparent 40%),
        radial-gradient(circle at 60% 100%, rgba(15,118,110,.10) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    ::selection { background: var(--indigo); color: #fff; }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 0 clamp(1rem, 3vw, 2.5rem) 4.5rem;
    }

    /* ---------- Header ---------- */
    header {
      text-align: center;
      padding: clamp(2.5rem, 6vw, 4.5rem) 0 clamp(1.5rem, 4vw, 2.5rem);
    }

    .header-label {
      display: inline-block;
      font-size: .85rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--indigo);
      background: #fff;
      border: 1px solid var(--border);
      padding: .55rem 1.3rem;
      border-radius: 999px;
      margin-bottom: 1.2rem;
      box-shadow: 0 8px 20px -12px rgba(15,27,61,.3);
    }

    header h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(2.8rem, 7vw, 5rem);
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    header h1 span { font-style: italic; font-weight: 500; color: var(--indigo); }

    .header-line {
      width: 4.5rem;
      height: 4px;
      background: linear-gradient(90deg, var(--indigo), var(--orange-l));
      margin: 1.3rem auto .9rem;
      border-radius: 999px;
    }

    header p:not(.header-label) { color: var(--ink-soft); font-size: 1.05rem; font-weight: 600; }

    /* Botones de juegos: dos tarjetas, colores distintos */
    .games-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(.8rem, 2vw, 1.4rem);
      max-width: 62rem;
      margin: 1.8rem auto 0;
    }

    .game-btn {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      text-align: left;
      min-height: clamp(7rem, 12vw, 9.5rem);
      padding: 1.4rem 1.6rem;
      border-radius: var(--radius-lg);
      font-weight: 800;
      font-size: clamp(1.15rem, 1.5vw, 1.6rem);
      line-height: 1.2;
      color: #fff;
      text-decoration: none;
      transition: transform .22s ease, box-shadow .22s ease;
    }

    .game-btn::before {
      content: '';
      position: absolute;
      width: 11rem; height: 11rem;
      right: -3rem; top: -4rem;
      border-radius: 50%;
      background: rgba(255,255,255,.16);
    }

    .game-btn::after {
      content: '';
      position: absolute;
      width: 6rem; height: 6rem;
      right: 2.2rem; top: 1.6rem;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.35);
    }

    .game-btn-verbs {
      background: linear-gradient(140deg, #5B50F0 0%, var(--indigo-d) 100%);
      box-shadow: 0 18px 34px -16px rgba(49,46,129,.7);
    }

    .game-btn-questions {
      background: linear-gradient(140deg, var(--orange-l) 0%, #9A3412 100%);
      box-shadow: 0 18px 34px -16px rgba(154,52,18,.65);
    }

    .game-btn:hover { transform: translateY(-4px); color: #fff; }
    .game-btn:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }

    /* ---------- Buscador ---------- */
    .header-sub {
      color: var(--ink-soft);
      font-size: 1rem;
      font-weight: 600;
      margin-top: .5rem;
      text-align: center;
    }

    .search-wrap { position: relative; margin: 1.2rem 0 1.4rem; }

    .search-icon {
      position: absolute;
      left: 1.4rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.3rem;
      pointer-events: none;
      opacity: .6;
    }

    #searchInput {
      width: 100%;
      padding: 1.25rem 4rem 1.25rem 3.7rem;
      font-family: 'Manrope', sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--card-bg);
      color: var(--ink);
      outline: none;
      transition: border-color .22s, box-shadow .22s;
      box-shadow: 0 10px 26px -14px rgba(15,27,61,.3);
    }

    #searchInput::placeholder { color: #9AA3C4; }

    #searchInput:focus {
      border-color: var(--indigo);
      box-shadow: 0 0 0 5px rgba(67,56,202,.16), 0 10px 26px -14px rgba(15,27,61,.3);
    }

    .clear-btn {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 2.4rem;
      height: 2.4rem;
      background: var(--bg-2);
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--ink-soft);
      display: none;
      line-height: 1;
      border-radius: 50%;
      transition: color .2s, background .2s;
    }

    .clear-btn:hover { color: #fff; background: var(--red); }

    /* ---------- Filtros ---------- */
    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: .7rem;
      margin-bottom: 1.4rem;
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .6rem;
      padding: .55rem;
      border: 2.5px solid var(--teal);
      border-radius: 2rem;
      background: rgba(255,255,255,.7);
    }

    .pill {
      padding: .7rem 1.4rem;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all .18s ease;
      user-select: none;
      background: #fff;
      box-shadow: 0 4px 12px -8px rgba(15,27,61,.35);
    }

    .pill-all { color: var(--ink); border-color: var(--ink); }
    .pill-all:hover, .pill-all.active { background: var(--ink); color: #fff; }

    .pill-irreg { border-color: var(--red); color: var(--red); }
    .pill-irreg.active { background: var(--red); color: #fff; }
    .pill-irreg:hover:not(.active) { background: var(--red-soft); transform: translateY(-2px); }

    .pill-reg { border-color: var(--teal); color: var(--teal); }
    .pill-reg.active { background: var(--teal); color: #fff; }
    .pill-reg:hover:not(.active) { background: var(--teal-soft); transform: translateY(-2px); }

    .pill-id { border-color: var(--purple); color: var(--purple); }
    .pill-id.active { background: var(--purple); color: #fff; }
    .pill-id:hover:not(.active) { background: var(--purple-soft); transform: translateY(-2px); }

    .pill-t { border-color: var(--blue); color: var(--blue); }
    .pill-t.active { background: var(--blue); color: #fff; }
    .pill-t:hover:not(.active) { background: var(--blue-soft); transform: translateY(-2px); }

    .pill-d { border-color: var(--green); color: var(--green); }
    .pill-d.active { background: var(--green); color: #fff; }
    .pill-d:hover:not(.active) { background: var(--green-soft); transform: translateY(-2px); }

    /* ---------- Contador ---------- */
    .stats-bar { margin-bottom: 1.2rem; font-size: 1.05rem; color: var(--muted); }
    .stats-count strong { color: var(--ink); font-weight: 800; }

    /* ---------- Tarjetas ---------- */
    .results-grid { display: grid; gap: 1.3rem; grid-template-columns: minmax(0, 1fr); }

    .verb-card {
      position: relative;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--border);
      overflow: hidden;
      transition: transform .22s ease, box-shadow .22s ease;
      animation: fadeUp .28s ease both;
      box-shadow: var(--shadow-card);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .verb-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.6rem 2rem 1.3rem;
      background: linear-gradient(180deg, #F5F6FF 0%, #fff 100%);
      border-bottom: 1px solid var(--border);
      gap: 1rem;
      flex-wrap: wrap;
    }

    .infinitive-word {
      font-family: 'Fraunces', serif;
      font-size: clamp(2.4rem, 3vw, 3.4rem);
      font-weight: 700;
      color: var(--indigo);
      letter-spacing: -0.015em;
      line-height: 1.05;
    }

    .spanish-word {
      font-size: clamp(1.25rem, 1.5vw, 1.7rem);
      color: var(--orange);
      font-weight: 600;
      font-style: italic;
      margin-top: .35rem;
    }

    .badge-wrap { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }

    .badge {
      padding: .5rem 1.1rem;
      border-radius: 999px;
      font-size: .9rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .badge-irreg { background: var(--red-soft); color: var(--red); border: 1px solid #F6BFCB; }
    .badge-reg   { background: var(--teal-soft); color: var(--teal); border: 1px solid #A8DED6; }
    .badge-sound { background: var(--purple-soft); color: var(--purple); border: 1px solid #DDBFF8; }

    /* 3 columnas */
    .card-forms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .form-cell {
      min-width: 0;
      overflow-wrap: anywhere;
      padding: 1.5rem 1.2rem 1.7rem;
      border-right: 1px solid var(--border);
      text-align: center;
      border-top: 5px solid transparent;
    }

    .form-cell:nth-child(1) { border-top-color: var(--indigo); }
    .form-cell:nth-child(2) { border-top-color: var(--orange-l); }
    .form-cell:nth-child(3) { border-top-color: var(--teal); }
    .form-cell:last-child { border-right: none; }

    .form-label {
      font-size: .9rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: .6rem;
    }

    .form-cell:nth-child(1) .form-label { color: var(--indigo); }
    .form-cell:nth-child(2) .form-label { color: var(--orange); }
    .form-cell:nth-child(3) .form-label { color: var(--teal); }

    .form-en {
      font-size: clamp(1.7rem, 2.1vw, 2.4rem);
      font-weight: 800;
      color: var(--ink);
      line-height: 1.2;
    }

    .form-es {
      font-size: clamp(1.15rem, 1.3vw, 1.5rem);
      font-style: italic;
      font-weight: 600;
      margin-top: .4rem;
      line-height: 1.35;
    }

    .form-cell:nth-child(1) .form-es { color: var(--indigo); }
    .form-cell:nth-child(2) .form-es { color: var(--orange); }
    .form-cell:nth-child(3) .form-es { color: var(--teal); }

    .no-results { text-align: center; padding: 5rem 1rem; color: var(--muted); animation: fadeUp .3s ease; }
    .no-results .emoji { font-size: 3.6rem; margin-bottom: 1rem; }
    .no-results h3 { font-family: 'Fraunces', serif; font-size: 1.8rem; color: var(--ink); margin-bottom: .6rem; }

    mark { background: rgba(234,88,12,.25); color: inherit; border-radius: 4px; padding: 0 3px; }

    /* ── Voz ── */
    .form-en-wrap { flex-wrap: wrap; display: flex; align-items: center; justify-content: center; gap: .6rem; }

    .speak-btn {
      background: var(--bg-2);
      border: none;
      cursor: pointer;
      width: 2.5rem;
      height: 2.5rem;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0;
      border-radius: 50%;
      transition: transform .15s, background .18s;
      flex-shrink: 0;
      display: inline-grid;
      place-items: center;
    }

    .speak-btn:hover { transform: scale(1.12); background: #C7CEF5; }
    .speak-btn.speaking { background: var(--indigo); animation: pulse-speak .5s ease infinite alternate; }

    @keyframes pulse-speak {
      from { transform: scale(1); opacity: .8; }
      to   { transform: scale(1.15); opacity: 1; }
    }

    .speak-all-btn {
      background: var(--indigo);
      border: 2px solid var(--indigo);
      color: #fff;
      border-radius: 999px;
      padding: .6rem 1.3rem;
      font-size: 1.05rem;
      font-weight: 800;
      font-family: 'Manrope', sans-serif;
      cursor: pointer;
      transition: background .18s, transform .15s;
      white-space: nowrap;
    }

    .speak-all-btn:hover { background: var(--indigo-d); border-color: var(--indigo-d); transform: translateY(-2px); }
    .speak-all-btn.speaking { background: var(--orange-l); border-color: var(--orange-l); animation: pulse-speak .5s ease infinite alternate; }

    /* ---------- Easter Egg ---------- */
    #eggOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,27,61,.6);
      backdrop-filter: blur(5px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      animation: fadeIn .2s ease;
    }

    #eggOverlay.visible { display: flex; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #eggBox {
      background: var(--card-bg);
      border-radius: 1.8rem;
      padding: 2.6rem 2.2rem 2rem;
      max-width: 28rem;
      width: 90%;
      text-align: center;
      box-shadow: 0 26px 60px rgba(15,27,61,.45);
      border: 2px solid var(--bg-2);
      animation: popUp .3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes popUp {
      from { opacity: 0; transform: scale(.82) translateY(24px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    #eggEmoji { font-size: 3rem; margin-bottom: .7rem; }
    #eggName { font-family: 'Fraunces', serif; font-size: 1.9rem; font-weight: 700; color: var(--indigo); margin-bottom: 1rem; }
    #eggMsg { font-size: 1.05rem; color: var(--ink); line-height: 1.7; }
    .egg-divider { width: 3.2rem; height: 4px; background: linear-gradient(90deg, var(--indigo), var(--orange-l)); margin: 1.1rem auto; border-radius: 999px; }

    #eggClose {
      margin-top: 1.6rem;
      padding: .8rem 2.2rem;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-family: 'Manrope', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }

    #eggClose:hover { background: var(--indigo); transform: scale(1.04); }

    /* ---------- Pantallas grandes ---------- */
    @media (min-width: 1700px) {
      .results-grid { gap: 1.6rem; }
    }

    /* ---------- Móvil ---------- */
    @media (max-width: 700px) {
      .wrapper { padding-left: 1rem; padding-right: 1rem; }
      header h1 { font-size: 2.6rem; }
      .games-row { grid-template-columns: minmax(0, 1fr); }
      .game-btn { font-size: 1.15rem; padding: 1.1rem 1.2rem; }
      .game-btn::before { width: 7rem; height: 7rem; }
      .game-btn::after { width: 3.5rem; height: 3.5rem; right: 1.6rem; top: 1rem; }
      #searchInput { font-size: 1.05rem; padding: 1rem 3.2rem 1rem 3.1rem; }
      .search-icon { left: 1.1rem; font-size: 1.1rem; }
      .infinitive-word { font-size: 2.2rem; }
      .spanish-word { font-size: 1.15rem; }
      .form-en { font-size: 1.6rem; }
      .form-es { font-size: 1.1rem; }
      .game-btn { min-height: 6rem; }
      .card-forms { grid-template-columns: minmax(0, 1fr); }
      .form-cell { border-top-width: 4px; border-right: none; border-bottom: 1px solid var(--border); padding: 1.1rem 1.2rem 1.3rem; }
      .form-cell:last-child { border-bottom: none; }
      .card-top { padding: 1.3rem 1.3rem 1.1rem; }
      .speak-all-btn { width: 100%; text-align: center; order: 3; }
      .badge-wrap { width: 100%; }
      .pill-group { width: 100%; border-radius: 1.6rem; }
      .pill { padding: .65rem 1.1rem; font-size: .95rem; }
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <header>
      <p class="header-label">Diccionario de Verbos</p>
      <h1>English <span>Verb</span><br>Dictionary</h1>
      <div class="header-line"></div>
      <p>Created by • Isaac-maker</p>
      <div class="header-line"></div>

      <div class="games-row">
        <a class="game-btn game-btn-verbs" href="juego_verbos.html">Juega y practica los verbos !!!</a>
        <a class="game-btn game-btn-questions" href="juego2.html">Juega y practica preguntas !!!</a>
      </div>
      </header>

    <p class="header-sub">🔍 Busca en español o inglés · Regulares e Irregulares 👀</p>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Escribe un verbo… ej: run, correr, went…" autocomplete="off"
        spellcheck="false">
      <button class="clear-btn" id="clearBtn" title="Limpiar">✕</button>
    </div>

    <div class="filters">
      <span class="pill pill-all active" data-filter="all">Todos</span>
      <span class="pill pill-irreg" data-filter="irregular">Irregulares</span>
      <div class="pill-group">
        <span class="pill pill-reg" data-filter="regular">Regulares</span>
        <span class="pill pill-id" data-filter="id">/id/ sound</span>
        <span class="pill pill-t" data-filter="t">/t/ sound</span>
        <span class="pill pill-d" data-filter="d">/d/ sound</span>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stats-count" id="statsCount"></div>
    </div>

    <div class="results-grid" id="results"></div>
  </div>

  <!-- Easter Egg Modal -->
  <div id="eggOverlay">
    <div id="eggBox">
      <div id="eggEmoji"></div>
      <div id="eggName"></div>
      <div class="egg-divider"></div>
      <div id="eggMsg"></div>
      <button id="eggClose">Cerrar</button>
    </div>
  </div>

  <script src="verbs-extra.js"></script>
  <script>
    const VERBS = [
      // ─── IRREGULARES ────────────────────────────────────────────
      { type: "irregular", base: "Arise", past: "Arose", participle: "Arisen", esPres: "Surgir / Levantarse", esPast: "Surgió / Se levantó", esPart: "Surgido / Levantado" },
      { type: "irregular", base: "Awake", past: "Awoke", participle: "Awoken", esPres: "Despertarse", esPast: "Se despertó", esPart: "Despertado" },
      { type: "irregular", base: "Be", past: "Was / Were", participle: "Been", esPres: "Ser / Estar", esPast: "Fue / Estuvo", esPart: "Sido / Estado" },
      { type: "irregular", base: "Bear", past: "Bore", participle: "Borne / Born", esPres: "Soportar / Dar a luz", esPast: "Soportó / Dio a luz", esPart: "Soportado / Nacido" },
      { type: "irregular", base: "Beat", past: "Beat", participle: "Beaten", esPres: "Golpear", esPast: "Golpeó", esPart: "Golpeado" },
      { type: "irregular", base: "Become", past: "Became", participle: "Become", esPres: "Llegar a ser", esPast: "Llegó a ser", esPart: "Llegado a ser" },
      { type: "irregular", base: "Begin", past: "Began", participle: "Begun", esPres: "Empezar", esPast: "Empezó", esPart: "Empezado" },

      // ─── REGULARES /d/ ADICIONALES ──────────────────────────────
      { type: "regular", sound: "d", base: "Allow", past: "Allowed", participle: "Allowed", esPres: "Permitir / Dejar", esPast: "Permitió / Dejó", esPart: "Permitido / Dejado" },
      { type: "regular", sound: "d", base: "Apply", past: "Applied", participle: "Applied", esPres: "Aplicar / Solicitar", esPast: "Aplicó / Solicitó", esPart: "Aplicado / Solicitado" },
      { type: "regular", sound: "d", base: "Believe", past: "Believed", participle: "Believed", esPres: "Creer", esPast: "Creyó", esPart: "Creído" },
      { type: "regular", sound: "d", base: "Borrow", past: "Borrowed", participle: "Borrowed", esPres: "Pedir prestado", esPast: "Pidió prestado", esPart: "Pedido prestado" },
      { type: "regular", sound: "d", base: "Care", past: "Cared", participle: "Cared", esPres: "Cuidar / Importar", esPast: "Cuidó / Importó", esPart: "Cuidado / Importado" },
      { type: "regular", sound: "d", base: "Carry", past: "Carried", participle: "Carried", esPres: "Llevar / Cargar", esPast: "Llevó / Cargó", esPart: "Llevado / Cargado" },
      { type: "regular", sound: "d", base: "Compare", past: "Compared", participle: "Compared", esPres: "Comparar", esPast: "Comparó", esPart: "Comparado" },
      { type: "regular", sound: "d", base: "Continue", past: "Continued", participle: "Continued", esPres: "Continuar / Seguir", esPast: "Continuó / Siguió", esPart: "Continuado / Seguido" },
      { type: "regular", sound: "d", base: "Cover", past: "Covered", participle: "Covered", esPres: "Cubrir / Tapar", esPast: "Cubrió / Tapó", esPart: "Cubierto / Tapado" },
      { type: "regular", sound: "d", base: "Create", past: "Created", participle: "Created", esPres: "Crear", esPast: "Creó", esPart: "Creado" },
      { type: "regular", sound: "d", base: "Decide", past: "Decided", participle: "Decided", esPres: "Decidir", esPast: "Decidió", esPart: "Decidido" },
      { type: "regular", sound: "d", base: "Desire", past: "Desired", participle: "Desired", esPres: "Desear / Anhelar", esPast: "Deseó / Anheló", esPart: "Deseado / Anhelado" },
      { type: "regular", sound: "d", base: "Divide", past: "Divided", participle: "Divided", esPres: "Dividir", esPast: "Dividió", esPart: "Dividido" },
      { type: "regular", sound: "d", base: "Download", past: "Downloaded", participle: "Downloaded", esPres: "Descargar", esPast: "Descargó", esPart: "Descargado" },
      { type: "regular", sound: "d", base: "Earn", past: "Earned", participle: "Earned", esPres: "Ganar / Ganarse", esPast: "Ganó / Se ganó", esPart: "Ganado" },
      { type: "regular", sound: "d", base: "Enable", past: "Enabled", participle: "Enabled", esPres: "Habilitar / Permitir", esPast: "Habilitó / Permitió", esPart: "Habilitado / Permitido" },
      { type: "regular", sound: "d", base: "Explain", past: "Explained", participle: "Explained", esPres: "Explicar", esPast: "Explicó", esPart: "Explicado" },
      { type: "regular", sound: "d", base: "Fail", past: "Failed", participle: "Failed", esPres: "Fallar / Fracasar", esPast: "Falló / Fracasó", esPart: "Fallado / Fracasado" },
      { type: "regular", sound: "d", base: "Form", past: "Formed", participle: "Formed", esPres: "Formar", esPast: "Formó", esPart: "Formado" },
      { type: "regular", sound: "d", base: "Hire", past: "Hired", participle: "Hired", esPres: "Contratar / Alquilar", esPast: "Contrató / Alquiló", esPart: "Contratado / Alquilado" },
      { type: "regular", sound: "d", base: "Improve", past: "Improved", participle: "Improved", esPres: "Mejorar", esPast: "Mejoró", esPart: "Mejorado" },
      { type: "regular", sound: "d", base: "Include", past: "Included", participle: "Included", esPres: "Incluir", esPast: "Incluyó", esPart: "Incluido" },
      { type: "regular", sound: "d", base: "Involve", past: "Involved", participle: "Involved", esPres: "Involucrar / Implicar", esPast: "Involucró / Implicó", esPart: "Involucrado / Implicado" },
      { type: "regular", sound: "d", base: "Join", past: "Joined", participle: "Joined", esPres: "Unirse / Unir", esPast: "Se unió / Unió", esPart: "Unido" },
      { type: "regular", sound: "d", base: "Kill", past: "Killed", participle: "Killed", esPres: "Matar", esPast: "Mató", esPart: "Matado" },
      { type: "regular", sound: "d", base: "Maintain", past: "Maintained", participle: "Maintained", esPres: "Mantener", esPast: "Mantuvo", esPart: "Mantenido" },
      { type: "regular", sound: "d", base: "Measure", past: "Measured", participle: "Measured", esPres: "Medir", esPast: "Midió", esPart: "Medido" },
      { type: "regular", sound: "d", base: "Offer", past: "Offered", participle: "Offered", esPres: "Ofrecer", esPast: "Ofreció", esPart: "Ofrecido" },
      { type: "regular", sound: "d", base: "Operate", past: "Operated", participle: "Operated", esPres: "Operar / Funcionar", esPast: "Operó / Funcionó", esPart: "Operado / Funcionado" },
      { type: "regular", sound: "d", base: "Perform", past: "Performed", participle: "Performed", esPres: "Realizar / Actuar", esPast: "Realizó / Actuó", esPart: "Realizado / Actuado" },
      { type: "regular", sound: "d", base: "Pull", past: "Pulled", participle: "Pulled", esPres: "Jalar / Tirar", esPast: "Jaló / Tiró", esPart: "Jalado / Tirado" },
      { type: "regular", sound: "d", base: "Realize", past: "Realized", participle: "Realized", esPres: "Darse cuenta / Realizar", esPast: "Se dio cuenta / Realizó", esPart: "Dado cuenta / Realizado" },
      { type: "regular", sound: "d", base: "Relate", past: "Related", participle: "Related", esPres: "Relacionar", esPast: "Relacionó", esPart: "Relacionado" },
      { type: "regular", sound: "d", base: "Remain", past: "Remained", participle: "Remained", esPres: "Permanecer / Quedarse", esPast: "Permaneció / Se quedó", esPart: "Permanecido / Quedado" },
      { type: "regular", sound: "d", base: "Require", past: "Required", participle: "Required", esPres: "Requerir / Necesitar", esPast: "Requirió / Necesitó", esPart: "Requerido / Necesitado" },
      { type: "regular", sound: "d", base: "Respond", past: "Responded", participle: "Responded", esPres: "Responder", esPast: "Respondió", esPart: "Respondido" },
      { type: "regular", sound: "d", base: "Return", past: "Returned", participle: "Returned", esPres: "Regresar / Devolver", esPast: "Regresó / Devolvió", esPart: "Regresado / Devuelto" },
      { type: "regular", sound: "d", base: "Reveal", past: "Revealed", participle: "Revealed", esPres: "Revelar", esPast: "Reveló", esPart: "Revelado" },
      { type: "regular", sound: "d", base: "Review", past: "Reviewed", participle: "Reviewed", esPres: "Revisar / Repasar", esPast: "Revisó / Repasó", esPart: "Revisado / Repasado" },
      { type: "regular", sound: "d", base: "Save", past: "Saved", participle: "Saved", esPres: "Salvar / Guardar / Ahorrar", esPast: "Salvó / Guardó / Ahorró", esPart: "Salvado / Guardado / Ahorrado" },
      { type: "regular", sound: "d", base: "Serve", past: "Served", participle: "Served", esPres: "Servir", esPast: "Sirvió", esPart: "Servido" },
      { type: "regular", sound: "d", base: "Solve", past: "Solved", participle: "Solved", esPres: "Resolver / Solucionar", esPast: "Resolvió / Solucionó", esPart: "Resuelto / Solucionado" },
      { type: "regular", sound: "d", base: "Supply", past: "Supplied", participle: "Supplied", esPres: "Suministrar / Proveer", esPast: "Suministró / Proveyó", esPart: "Suministrado / Proveído" },
      { type: "regular", sound: "d", base: "Suppose", past: "Supposed", participle: "Supposed", esPres: "Suponer", esPast: "Supuso", esPart: "Supuesto" },
      { type: "regular", sound: "d", base: "Survive", past: "Survived", participle: "Survived", esPres: "Sobrevivir", esPast: "Sobrevivió", esPart: "Sobrevivido" },
      { type: "regular", sound: "d", base: "Upload", past: "Uploaded", participle: "Uploaded", esPres: "Subir / Cargar", esPast: "Subió / Cargó", esPart: "Subido / Cargado" },
      { type: "regular", sound: "d", base: "Vary", past: "Varied", participle: "Varied", esPres: "Variar", esPast: "Varió", esPart: "Variado" },
      { type: "regular", sound: "d", base: "Worry", past: "Worried", participle: "Worried", esPres: "Preocupar / Preocuparse", esPast: "Preocupó / Se preocupó", esPart: "Preocupado" },
    ];

    // ── Fusión con verbos adicionales (verbs-extra.js) ─────────────
    // Evita duplicados comparando el verbo base sin distinguir mayúsculas.
    if (typeof VERBS_EXTRA !== 'undefined') {
      const _existingBases = new Set(VERBS.map(v => v.base.toLowerCase()));
      VERBS_EXTRA.forEach(v => {
        const key = v.base.toLowerCase();
        if (!_existingBases.has(key)) {
          VERBS.push(v);
          _existingBases.add(key);
        }
      });
    }

    let currentFilter = 'all';
    let currentQuery = '';

    const input = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const results = document.getElementById('results');
    const statsCount = document.getElementById('statsCount');

    // ── Speech API ───────────────────────────────────────────────
    let _activeSpeakBtn = null;

    function speak(text, btn) {
      speechSynthesis.cancel();
      if (_activeSpeakBtn) { _activeSpeakBtn.classList.remove('speaking'); _activeSpeakBtn = null; }
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'en-US';
      utt.rate = 0.82;
      if (btn) {
        btn.classList.add('speaking');
        _activeSpeakBtn = btn;
        utt.onend = () => {
          btn.classList.remove('speaking');
          if (_activeSpeakBtn === btn) _activeSpeakBtn = null;
        };
      }
      speechSynthesis.speak(utt);
    }

    function speakAll(base, past, part, btn) {
      speechSynthesis.cancel();
      if (_activeSpeakBtn) { _activeSpeakBtn.classList.remove('speaking'); _activeSpeakBtn = null; }
      if (btn) { btn.classList.add('speaking'); _activeSpeakBtn = btn; }
      const texts = [base, past, part];
      let i = 0;
      function next() {
        if (i >= texts.length) {
          if (btn) { btn.classList.remove('speaking'); _activeSpeakBtn = null; }
          return;
        }
        const utt = new SpeechSynthesisUtterance(texts[i++]);
        utt.lang = 'en-US';
        utt.rate = 0.82;
        utt.onend = next;
        speechSynthesis.speak(utt);
      }
      next();
    }

    function highlight(text, query) {
      if (!query) return text;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
    }

    function matchesFilter(v) {
      if (currentFilter === 'all') return true;
      if (currentFilter === 'irregular') return v.type === 'irregular';
      if (currentFilter === 'regular') return v.type === 'regular';
      if (currentFilter === 'id') return v.sound === 'id';
      if (currentFilter === 't') return v.sound === 't';
      if (currentFilter === 'd') return v.sound === 'd';
      return true;
    }

    function matchesQuery(v, q) {
      if (!q) return true;
      const lq = q.toLowerCase();
      return [v.base, v.past, v.participle, v.esPres, v.esPast, v.esPart].some(f =>
        f.toLowerCase().includes(lq)
      );
    }

    function render() {
      const q = currentQuery.trim();
      const filtered = VERBS.filter(v => matchesFilter(v) && matchesQuery(v, q));

      const total = VERBS.filter(matchesFilter).length;
      statsCount.innerHTML = q
        ? `<strong>${filtered.length}</strong> resultado${filtered.length !== 1 ? 's' : ''} de <strong>${total}</strong>`
        : `<strong>${total}</strong> verbo${total !== 1 ? 's' : ''}`;

      if (filtered.length === 0) {
        results.innerHTML = `
      <div class="no-results">
        <div class="emoji">🔎</div>
        <h3>No se encontraron verbos</h3>
        <p>Prueba con otra palabra en inglés o español</p>
      </div>`;
        return;
      }

      results.innerHTML = filtered.map((v, i) => {
        const isIrreg = v.type === 'irregular';
        const soundLabel = v.sound ? (v.sound === 'id' ? '/id/' : v.sound === 't' ? '/t/' : '/d/') : '';
        const delay = Math.min(i * 30, 300);

        const typeBadge = isIrreg
          ? `<span class="badge badge-irreg">Irregular</span>`
          : `<span class="badge badge-reg">Regular</span>`;

        const soundBadge = soundLabel
          ? `<span class="badge badge-sound">${soundLabel} sound</span>`
          : '';

        // Escape for use inside onclick attribute strings
        const bEsc = v.base.replace(/'/g, "\\'");
        const pEsc = v.past.replace(/'/g, "\\'");
        const ptEsc = v.participle.replace(/'/g, "\\'");

        const hBase = highlight(v.base, q);
        const hPast = highlight(v.past, q);
        const hPart = highlight(v.participle, q);
        const hPres = highlight(v.esPres, q);
        const hEsPast = highlight(v.esPast, q);
        const hEsPart = highlight(v.esPart, q);

        return `
    <div class="verb-card" style="animation-delay:${delay}ms">
      <div class="card-top">
        <div>
          <div class="infinitive-word">${hBase}</div>
          <div class="spanish-word">${hPres}</div>
        </div>
        <div class="badge-wrap">
          ${typeBadge}
          ${soundBadge}
          <button class="speak-all-btn" onclick="speakAll('${bEsc}','${pEsc}','${ptEsc}',this)" title="Pronunciar las 3 formas">🔊 ×3</button>
        </div>
      </div>
      <div class="card-forms">
        <div class="form-cell">
          <div class="form-label">Base Form</div>
          <div class="form-en-wrap">
            <span class="form-en">${hBase}</span>
            <button class="speak-btn" onclick="speak('${bEsc}',this)" title="Pronunciar">🔊</button>
          </div>
          <div class="form-es">${hPres}</div>
        </div>
        <div class="form-cell">
          <div class="form-label">Simple Past</div>
          <div class="form-en-wrap">
            <span class="form-en">${hPast}</span>
            <button class="speak-btn" onclick="speak('${pEsc}',this)" title="Pronunciar">🔊</button>
          </div>
          <div class="form-es">${hEsPast}</div>
        </div>
        <div class="form-cell">
          <div class="form-label">Past Participle</div>
          <div class="form-en-wrap">
            <span class="form-en">${hPart}</span>
            <button class="speak-btn" onclick="speak('${ptEsc}',this)" title="Pronunciar">🔊</button>
          </div>
          <div class="form-es">${hEsPart}</div>
        </div>
      </div>
    </div>`;
      }).join('');
    }

    // Events
    input.addEventListener('input', () => {
      currentQuery = input.value;
      clearBtn.style.display = currentQuery ? 'block' : 'none';
      checkEasterEgg(currentQuery.trim());
      render();
    });

    clearBtn.addEventListener('click', () => {
      input.value = '';
      currentQuery = '';
      clearBtn.style.display = 'none';
      input.focus();
      render();
    });

    document.querySelectorAll('.pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentFilter = pill.dataset.filter;
        render();
      });
    });

    // Easter Eggs
    const _e = [
      { k: "eddy", n: "Eddy", i: "📖", m: 'Proverbios 27:17\n\n"Ves… ese es el sonido del que le hablé, el famoso schwa" 😂' },
      { k: "mari", n: "Mari", i: "🎵", m: "Recomiéndeme una canción de esas de reggaeton viejito de las que me habló. 🎶" },
      { k: "naty", n: "Naty", i: "🇫🇷", m: '"Le français est facile."\n\nNaty, hackear sistemas es muy divertido, no me aliente 😂' },
      { k: "angelica", n: "Angélica", i: "🏆", m: "Asistencia perfecta 100% ✅" },
      { k: "michelle", n: "Michelle", i: "✈️", m: "Aprenda a usar paracaídas por si el avión se cae 😂" },
      { k: "arturo", n: "Arturo", i: "📚", m: "No voy a hablar de otro tema que no sea de la práctica, se lo prometo 😂" },
      { k: "joss", n: "Joss", i: "🐱", m: "Joss cierre la ventana, cuidado se escapa la gata otra vez.\n\nEsperó que la pata de su perrito esté mejor 🐾" },
      { k: "nicole", n: "Nicole", i: "📝", m: "Nicole, mañana hay exposición, espero esté preparada. ¡Pilas! ⚡" },
      { k: "eli", n: "Eli", i: "🐻", m: "Eli, gracias por la ayuda, siempre me estás ayudando. 💛\n\nSi ves al Oso Yogui me lo saluda 😂" },
    ];

    let _shown = false;

    function checkEasterEgg(q) {
      if (!q) { _shown = false; return; }
      const egg = _e.find(e => e.k === q.toLowerCase().trim());
      if (egg && !_shown) { _shown = true; showEgg(egg); }
      else if (!egg) { _shown = false; }
    }

    function showEgg(egg) {
      document.getElementById('eggEmoji').textContent = egg.i;
      document.getElementById('eggName').textContent = egg.n;
      document.getElementById('eggMsg').innerHTML = egg.m.replace(/\n/g, '<br>');
      document.getElementById('eggOverlay').classList.add('visible');
    }

    document.getElementById('eggClose').addEventListener('click', () => {
      document.getElementById('eggOverlay').classList.remove('visible');
    });

    document.getElementById('eggOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('eggOverlay'))
        document.getElementById('eggOverlay').classList.remove('visible');
    });

    render();
  </script>
</body>
