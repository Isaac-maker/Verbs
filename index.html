<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diccionario de Verbos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --cream: #f5f0e8;
    --gold: #c9a84c;
    --gold-light: #e8d5a3;
    --red: #c0392b;
    --teal: #1a7a6e;
    --teal-light: #d4f0ec;
    --card-bg: #ffffff;
    --muted: #7a7a8a;
    --border: #e0d8cc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(201,168,76,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(26,122,110,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* Header */
  header {
    text-align: center;
    padding: 50px 0 40px;
  }

  .header-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 6vw, 3.8rem);
    font-weight: 900;
    line-height: 1.1;
    color: var(--ink);
  }

  header h1 span {
    color: var(--teal);
  }

  .header-line {
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--teal));
    margin: 18px auto 14px;
    border-radius: 2px;
  }

  .header-sub {
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 300;
  }

  /* Search box */
  .search-wrap {
    position: relative;
    margin: 36px 0 16px;
  }

  .search-icon {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.2rem;
    pointer-events: none;
    opacity: 0.4;
  }

  #searchInput {
    width: 100%;
    padding: 18px 60px 18px 52px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.05rem;
    font-weight: 400;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--card-bg);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }

  #searchInput::placeholder { color: #aaa; }

  #searchInput:focus {
    border-color: var(--teal);
    box-shadow: 0 4px 20px rgba(26,122,110,0.15);
  }

  .clear-btn {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.3rem;
    color: var(--muted);
    display: none;
    line-height: 1;
    padding: 4px;
    border-radius: 50%;
    transition: color 0.2s, background 0.2s;
  }
  .clear-btn:hover { color: var(--red); background: rgba(192,57,43,0.08); }

  /* Filter pills */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }

  .pill {
    padding: 7px 16px;
    border-radius: 50px;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all 0.18s;
    user-select: none;
  }

  .pill-all { background: var(--ink); color: var(--cream); }
  .pill-all:hover, .pill-all.active { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .pill-all:not(.active) { background: transparent; color: var(--ink); border-color: var(--ink); }

  .pill-irreg { border-color: var(--red); color: var(--red); }
  .pill-irreg.active { background: var(--red); color: #fff; }
  .pill-irreg:hover:not(.active) { background: rgba(192,57,43,0.06); }

  .pill-reg { border-color: var(--teal); color: var(--teal); }
  .pill-reg.active { background: var(--teal); color: #fff; }
  .pill-reg:hover:not(.active) { background: rgba(26,122,110,0.06); }

  .pill-id { border-color: #8e44ad; color: #8e44ad; }
  .pill-id.active { background: #8e44ad; color: #fff; }
  .pill-id:hover:not(.active) { background: rgba(142,68,173,0.06); }

  .pill-t { border-color: #2980b9; color: #2980b9; }
  .pill-t.active { background: #2980b9; color: #fff; }
  .pill-t:hover:not(.active) { background: rgba(41,128,185,0.06); }

  .pill-d { border-color: #27ae60; color: #27ae60; }
  .pill-d.active { background: #27ae60; color: #fff; }
  .pill-d:hover:not(.active) { background: rgba(39,174,96,0.06); }

  /* Stats bar */
  .stats-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 400;
  }

  .stats-count strong {
    color: var(--ink);
    font-weight: 600;
  }

  /* Results */
  .results-grid {
    display: grid;
    gap: 14px;
  }

  .verb-card {
    background: var(--card-bg);
    border-radius: 14px;
    border: 1.5px solid var(--border);
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    animation: fadeUp 0.25s ease both;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .verb-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.1);
    border-color: var(--gold-light);
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    flex-wrap: wrap;
  }

  .infinitive-word {
    font-family: 'Playfair Display', serif;
    font-size: 1.55rem;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.5px;
  }

  .spanish-word {
    font-size: 0.9rem;
    color: var(--muted);
    font-weight: 400;
    font-style: italic;
    margin-top: 2px;
  }

  .badge-wrap {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }

  .badge {
    padding: 4px 11px;
    border-radius: 50px;
    font-size: 0.73rem;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .badge-irreg { background: rgba(192,57,43,0.1); color: var(--red); }
  .badge-reg   { background: rgba(26,122,110,0.1); color: var(--teal); }
  .badge-id    { background: rgba(142,68,173,0.1); color: #8e44ad; }
  .badge-t     { background: rgba(41,128,185,0.1); color: #2980b9; }
  .badge-d     { background: rgba(39,174,96,0.1); color: #27ae60; }
  .badge-sound { background: rgba(201,168,76,0.12); color: #a07830; font-size: 0.7rem; }

  .card-forms {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    divide-x: 1px solid var(--border);
  }

  .form-cell {
    padding: 14px 18px;
    border-right: 1px solid var(--border);
    text-align: center;
  }

  .form-cell:last-child { border-right: none; }

  .form-label {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .form-value {
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink);
  }

  /* No results */
  .no-results {
    text-align: center;
    padding: 70px 20px;
    color: var(--muted);
    animation: fadeUp 0.3s ease;
  }

  .no-results .emoji { font-size: 3rem; margin-bottom: 16px; }

  .no-results h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--ink);
    margin-bottom: 8px;
  }

  /* Highlight */
  mark {
    background: rgba(201,168,76,0.35);
    color: inherit;
    border-radius: 3px;
    padding: 0 2px;
  }

  @media (max-width: 560px) {
    .card-forms { grid-template-columns: 1fr 1fr; }
    .card-forms .form-cell:nth-child(2) { border-right: none; }
    .card-forms .form-cell:nth-child(3) { border-right: none; border-top: 1px solid var(--border); grid-column: 1 / -1; }
    .infinitive-word { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <header>

    <button class="clear-btn" id="clearBtn" title="Limpiar">✕</button>
  </div>

  <div class="filters">
    <span class="pill pill-all active" data-filter="all">Todos</span>
    <span class="pill pill-irreg" data-filter="irregular">Irregulares</span>
    <span class="pill pill-reg" data-filter="regular">Regulares</span>
    <span class="pill pill-id" data-filter="id">/id/ sound</span>
    <span class="pill pill-t" data-filter="t">/t/ sound</span>
    <span class="pill pill-d" data-filter="d">/d/ sound</span>
  </div>

  <div class="stats-bar">
    <div class="stats-count" id="statsCount"></div>
  </div>

  <div class="results-grid" id="results"></div>
</div>

let currentFilter = 'all';
let currentQuery = '';

const input = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const results = document.getElementById('results');
const statsCount = document.getElementById('statsCount');

function highlight(text, query) {
  if (!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
}

function matchesFilter(v) {
  if (currentFilter === 'all') return true;
  if (currentFilter === 'irregular') return v.type === 'irregular';
  if (currentFilter === 'regular') return v.type === 'regular';
  if (currentFilter === 'id') return v.sound === 'id';
  if (currentFilter === 't') return v.sound === 't';
  if (currentFilter === 'd') return v.sound === 'd';
  return true;
}

function matchesQuery(v, q) {
  if (!q) return true;
  const lq = q.toLowerCase();
  return [v.base, v.past, v.participle, v.es].some(f =>
    f.toLowerCase().includes(lq)
  );
}

function getSoundLabel(v) {
  if (v.type === 'irregular') return '';
  return v.sound === 'id' ? '/id/' : v.sound === 't' ? '/t/' : '/d/';
}

function render() {
  const q = currentQuery.trim();
  const filtered = VERBS.filter(v => matchesFilter(v) && matchesQuery(v, q));

  // Stats
  const total = VERBS.filter(matchesFilter).length;
  statsCount.innerHTML = q
    ? `<strong>${filtered.length}</strong> resultado${filtered.length !== 1 ? 's' : ''} de <strong>${total}</strong>`
    : `<strong>${total}</strong> verbo${total !== 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    results.innerHTML = `
      <div class="no-results">
        <div class="emoji">🔎</div>
        <h3>No se encontraron verbos</h3>
        <p>Prueba con otra palabra en inglés o español</p>
      </div>`;
    return;
  }

  results.innerHTML = filtered.map((v, i) => {
    const isIrreg = v.type === 'irregular';
    const soundLabel = getSoundLabel(v);
    const delay = Math.min(i * 30, 300);

    const typeBadge = isIrreg
      ? `<span class="badge badge-irreg">Irregular</span>`
      : `<span class="badge badge-reg">Regular</span>`;

    const soundBadge = soundLabel
      ? `<span class="badge badge-sound">${soundLabel} sound</span>`
      : '';

    const hBase = highlight(v.base, q);
    const hPast = highlight(v.past, q);
    const hPart = highlight(v.participle, q);
    const hEs   = highlight(v.es, q);

    return `
    <div class="verb-card" style="animation-delay:${delay}ms">
      <div class="card-top">
        <div>
          <div class="infinitive-word">${hBase}</div>
          <div class="spanish-word">${hEs}</div>
        </div>
        <div class="badge-wrap">
          ${typeBadge}
          ${soundBadge}
        </div>
      </div>
      <div class="card-forms">
        <div class="form-cell">
          <div class="form-label">Base Form</div>
          <div class="form-value">${hBase}</div>
        </div>
        <div class="form-cell">
          <div class="form-label">Simple Past</div>
          <div class="form-value">${hPast}</div>
        </div>
        <div class="form-cell">
          <div class="form-label">Past Participle</div>
          <div class="form-value">${hPart}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// Events
input.addEventListener('input', () => {
  currentQuery = input.value;
  clearBtn.style.display = currentQuery ? 'block' : 'none';
  render();
});

clearBtn.addEventListener('click', () => {
  input.value = '';
  currentQuery = '';
  clearBtn.style.display = 'none';
  input.focus();
  render();
});

document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    currentFilter = pill.dataset.filter;
    render();
  });
});

// Initial render
render();
</script>
