<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diccionario de Verbos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --cream: #f5f0e8;
    --gold: #c9a84c;
    --gold-light: #e8d5a3;
    --red: #c0392b;
    --teal: #1a7a6e;
    --teal-light: #d4f0ec;
    --card-bg: #ffffff;
    --muted: #7a7a8a;
    --border: #e0d8cc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(201,168,76,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(26,122,110,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  header {
    text-align: center;
    padding: 50px 0 40px;
  }

  .header-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 6vw, 3.8rem);
    font-weight: 900;
    line-height: 1.1;
    color: var(--ink);
  }

  header h1 span { color: var(--teal); }

  .header-line {
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--teal));
    margin: 18px auto 14px;
    border-radius: 2px;
  }

  .header-sub {
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 300;
  }

  .search-wrap {
    position: relative;
    margin: 36px 0 16px;
  }

  .search-icon {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.2rem;
    pointer-events: none;
    opacity: 0.4;
  }

  #searchInput {
    width: 100%;
    padding: 18px 60px 18px 52px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.05rem;
    font-weight: 400;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--card-bg);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }

  #searchInput::placeholder { color: #aaa; }

  #searchInput:focus {
    border-color: var(--teal);
    box-shadow: 0 4px 20px rgba(26,122,110,0.15);
  }

  .clear-btn {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.3rem;
    color: var(--muted);
    display: none;
    line-height: 1;
    padding: 4px;
    border-radius: 50%;
    transition: color 0.2s, background 0.2s;
  }
  .clear-btn:hover { color: var(--red); background: rgba(192,57,43,0.08); }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }

  .pill {
    padding: 7px 16px;
    border-radius: 50px;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all 0.18s;
    user-select: none;
  }

  .pill-all { background: var(--ink); color: var(--cream); }
  .pill-all:hover, .pill-all.active { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .pill-all:not(.active) { background: transparent; color: var(--ink); border-color: var(--ink); }

  .pill-irreg { border-color: var(--red); color: var(--red); }
  .pill-irreg.active { background: var(--red); color: #fff; }
  .pill-irreg:hover:not(.active) { background: rgba(192,57,43,0.06); }

  .pill-reg { border-color: var(--teal); color: var(--teal); }
  .pill-reg.active { background: var(--teal); color: #fff; }
  .pill-reg:hover:not(.active) { background: rgba(26,122,110,0.06); }

  .pill-id { border-color: #8e44ad; color: #8e44ad; }
  .pill-id.active { background: #8e44ad; color: #fff; }
  .pill-id:hover:not(.active) { background: rgba(142,68,173,0.06); }

  .pill-t { border-color: #2980b9; color: #2980b9; }
  .pill-t.active { background: #2980b9; color: #fff; }
  .pill-t:hover:not(.active) { background: rgba(41,128,185,0.06); }

  .pill-d { border-color: #27ae60; color: #27ae60; }
  .pill-d.active { background: #27ae60; color: #fff; }
  .pill-d:hover:not(.active) { background: rgba(39,174,96,0.06); }

  .stats-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .stats-count strong { color: var(--ink); font-weight: 600; }

  .results-grid { display: grid; gap: 14px; }

  .verb-card {
    background: var(--card-bg);
    border-radius: 14px;
    border: 1.5px solid var(--border);
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    animation: fadeUp 0.25s ease both;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .verb-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.1);
    border-color: var(--gold-light);
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    flex-wrap: wrap;
  }

  .infinitive-word {
    font-family: 'Playfair Display', serif;
    font-size: 1.55rem;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.5px;
  }

  .spanish-word {
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 400;
    font-style: italic;
    margin-top: 2px;
  }

  .badge-wrap {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }

  .badge {
    padding: 4px 11px;
    border-radius: 50px;
    font-size: 0.73rem;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .badge-irreg { background: rgba(192,57,43,0.1); color: var(--red); }
  .badge-reg   { background: rgba(26,122,110,0.1); color: var(--teal); }
  .badge-sound { background: rgba(201,168,76,0.12); color: #a07830; font-size: 0.7rem; }

  /* 3 columns: each has English + Spanish */
  .card-forms {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
  }

  .form-cell {
    padding: 14px 16px;
    border-right: 1px solid var(--border);
    text-align: center;
  }

  .form-cell:last-child { border-right: none; }

  .form-label {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .form-en {
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
  }

  .form-es {
    font-size: 0.78rem;
    color: var(--teal);
    font-style: italic;
    font-weight: 400;
    margin-top: 3px;
    line-height: 1.3;
  }

  .no-results {
    text-align: center;
    padding: 70px 20px;
    color: var(--muted);
    animation: fadeUp 0.3s ease;
  }

  .no-results .emoji { font-size: 3rem; margin-bottom: 16px; }

  .no-results h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--ink);
    margin-bottom: 8px;
  }

  mark {
    background: rgba(201,168,76,0.35);
    color: inherit;
    border-radius: 3px;
    padding: 0 2px;
  }

  /* Easter Egg Modal */
  #eggOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,26,46,0.55);
    backdrop-filter: blur(4px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.2s ease;
  }
  #eggOverlay.visible { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  #eggBox {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 40px 36px 32px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    border: 2px solid var(--gold-light);
    animation: popUp 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes popUp {
    from { opacity: 0; transform: scale(0.8) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  #eggEmoji { font-size: 2.6rem; margin-bottom: 10px; }

  #eggName {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem;
    font-weight: 900;
    color: var(--teal);
    margin-bottom: 14px;
  }

  #eggMsg { font-size: 1rem; color: var(--ink); line-height: 1.65; }

  .egg-divider {
    width: 40px; height: 2px;
    background: linear-gradient(90deg, var(--gold), var(--teal));
    margin: 16px auto; border-radius: 2px;
  }

  #eggClose {
    margin-top: 24px;
    padding: 10px 28px;
    background: var(--ink);
    color: var(--cream);
    border: none;
    border-radius: 50px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
  }
  #eggClose:hover { background: var(--teal); transform: scale(1.04); }

  @media (max-width: 600px) {
    .card-forms { grid-template-columns: 1fr; }
    .form-cell { border-right: none; border-bottom: 1px solid var(--border); }
    .form-cell:last-child { border-bottom: none; }
    .infinitive-word { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <p class="header-label">Diccionario de Verbos</p>
    <h1>English <span>Verb</span><br>Dictionary</h1>
    <div class="header-line"></div>
    <p>Created by • Isaac-maker</p>
    <div class="header-line"></div>
    <p class="header-sub">Busca en español o inglés · Regulares e Irregulares</p>
  </header>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Escribe un verbo… ej: run, correr, went…" autocomplete="off" spellcheck="false">
    <button class="clear-btn" id="clearBtn" title="Limpiar">✕</button>
  </div>

  <div class="filters">
    <span class="pill pill-all active" data-filter="all">Todos</span>
    <span class="pill pill-irreg" data-filter="irregular">Irregulares</span>
    <span class="pill pill-reg" data-filter="regular">Regulares</span>
    <span class="pill pill-id" data-filter="id">/id/ sound</span>
    <span class="pill pill-t" data-filter="t">/t/ sound</span>
    <span class="pill pill-d" data-filter="d">/d/ sound</span>
  </div>

  <div class="stats-bar">
    <div class="stats-count" id="statsCount"></div>
  </div>

  <div class="results-grid" id="results"></div>
</div>

<!-- Easter Egg Modal -->
<div id="eggOverlay">
  <div id="eggBox">
    <div id="eggEmoji"></div>
    <div id="eggName"></div>
    <div class="egg-divider"></div>
    <div id="eggMsg"></div>
    <button id="eggClose">Cerrar</button>
  </div>
</div>

<script>
// Each verb: base/past/participle in English + esPres/esPast/esParticiple in Spanish
const VERBS = [
  // ─── IRREGULARES ────────────────────────────────────────────
  {type:"irregular",base:"Arise",past:"Arose",participle:"Arisen",esPres:"Surgir / Levantarse",esPast:"Surgió / Se levantó",esPart:"Surgido / Levantado"},
  {type:"irregular",base:"Awake",past:"Awoke",participle:"Awoken",esPres:"Despertarse",esPast:"Se despertó",esPart:"Despertado"},
  {type:"irregular",base:"Be",past:"Was / Were",participle:"Been",esPres:"Ser / Estar",esPast:"Fue / Estuvo",esPart:"Sido / Estado"},
  {type:"irregular",base:"Bear",past:"Bore",participle:"Borne / Born",esPres:"Soportar / Dar a luz",esPast:"Soportó / Dio a luz",esPart:"Soportado / Nacido"},
  {type:"irregular",base:"Beat",past:"Beat",participle:"Beaten",esPres:"Golpear",esPast:"Golpeó",esPart:"Golpeado"},
  {type:"irregular",base:"Become",past:"Became",participle:"Become",esPres:"Llegar a ser",esPast:"Llegó a ser",esPart:"Llegado a ser"},
  {type:"irregular",base:"Begin",past:"Began",participle:"Begun",esPres:"Empezar",esPast:"Empezó",esPart:"Empezado"},
  {type:"irregular",base:"Bend",past:"Bent",participle:"Bent",esPres:"Doblar",esPast:"Dobló",esPart:"Doblado"},
  {type:"irregular",base:"Bet",past:"Bet",participle:"Bet",esPres:"Apostar",esPast:"Apostó",esPart:"Apostado"},

  {type:"irregular",base:"Bid",past:"Bid",participle:"Bid",esPres:"Pujar",esPast:"Pujó",esPart:"Pujado"},
  {type:"irregular",base:"Bite",past:"Bit",participle:"Bitten",esPres:"Morder",esPast:"Mordió",esPart:"Mordido"},
  {type:"irregular",base:"Bleed",past:"Bled",participle:"Bled",esPres:"Sangrar",esPast:"Sangró",esPart:"Sangrado"},
  {type:"irregular",base:"Blow",past:"Blew",participle:"Blown",esPres:"Soplar",esPast:"Sopló",esPart:"Soplado"},

  {type:"irregular",base:"Cling",past:"Clung",participle:"Clung",esPres:"Agarrarse",esPast:"Se agarró",esPart:"Agarrado"},
  {type:"irregular",base:"Come",past:"Came",participle:"Come",esPres:"Venir",esPast:"Vino",esPart:"Venido"},
  {type:"irregular",base:"Cost",past:"Cost",participle:"Cost",esPres:"Costar",esPast:"Costó",esPart:"Costado"},

  {type:"irregular",base:"Find",past:"Found",participle:"Found",esPres:"Encontrar",esPast:"Encontró",esPart:"Encontrado"},

  {type:"irregular",base:"Forgive",past:"Forgave",participle:"Forgiven",esPres:"Perdonar",esPast:"Perdonó",esPart:"Perdonado"},

  {type:"irregular",base:"Hang",past:"Hung",participle:"Hung",esPres:"Colgar",esPast:"Colgó",esPart:"Colgado"},
  {type:"irregular",base:"Have",past:"Had",participle:"Had",esPres:"Tener / Haber",esPast:"Tuvo / Hubo",esPart:"Tenido / Habido"},
  {type:"irregular",base:"Hear",past:"Heard",participle:"Heard",esPres:"Oír",esPast:"Oyó",esPart:"Oído"},
  {type:"irregular",base:"Hide",past:"Hid",participle:"Hidden",esPres:"Ocultar / Esconder",esPast:"Ocultó / Escondió",esPart:"Ocultado / Escondido"},
  {type:"irregular",base:"Hit",past:"Hit",participle:"Hit",esPres:"Golpear",esPast:"Golpeó",esPart:"Golpeado"},
  {type:"irregular",base:"Hold",past:"Held",participle:"Held",esPres:"Agarrar / Celebrar",esPast:"Agarró / Celebró",esPart:"Agarrado / Celebrado"},
  {type:"irregular",base:"Hurt",past:"Hurt",participle:"Hurt",esPres:"Herir / Doler",esPast:"Hirió / Dolió",esPart:"Herido / Dolido"},
  {type:"irregular",base:"Keep",past:"Kept",participle:"Kept",esPres:"Conservar / Guardar",esPast:"Conservó / Guardó",esPart:"Conservado / Guardado"},
  {type:"irregular",base:"Kneel",past:"Knelt",participle:"Knelt",esPres:"Arrodillarse",esPast:"Se arrodilló",esPart:"Arrodillado"},
  {type:"irregular",base:"Knit",past:"Knit",participle:"Knit",esPres:"Hacer punto / Tejer",esPast:"Tejió",esPart:"Tejido"},
  {type:"irregular",base:"Know",past:"Knew",participle:"Known",esPres:"Saber / Conocer",esPast:"Supo / Conoció",esPart:"Sabido / Conocido"},
  {type:"irregular",base:"Lay",past:"Laid",participle:"Laid",esPres:"Poner / Colocar",esPast:"Puso / Colocó",esPart:"Puesto / Colocado"},

  {type:"regular",sound:"d",base:"Remember",past:"Remembered",participle:"Remembered",esPres:"Recordar",esPast:"Recordó",esPart:"Recordado"},
  {type:"regular",sound:"d",base:"Show",past:"Showed",participle:"Showed",esPres:"Mostrar / Enseñar",esPast:"Mostró / Enseñó",esPart:"Mostrado / Enseñado"},
  {type:"regular",sound:"d",base:"Stay",past:"Stayed",participle:"Stayed",esPres:"Permanecer / Quedarse",esPast:"Permaneció / Se quedó",esPart:"Permanecido / Quedado"},
  {type:"regular",sound:"d",base:"Study",past:"Studied",participle:"Studied",esPres:"Estudiar",esPast:"Estudió",esPart:"Estudiado"},
  {type:"regular",sound:"d",base:"Travel",past:"Traveled",participle:"Traveled",esPres:"Viajar",esPast:"Viajó",esPart:"Viajado"},
  {type:"regular",sound:"d",base:"Try",past:"Tried",participle:"Tried",esPres:"Intentar / Tratar",esPast:"Intentó / Trató",esPart:"Intentado / Tratado"},
  {type:"regular",sound:"d",base:"Turn",past:"Turned",participle:"Turned",esPres:"Voltear / Dar vuelta",esPast:"Volteó / Dio vuelta",esPart:"Volteado / Dado vuelta"},
];

let currentFilter = 'all';
let currentQuery = '';

const input = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const results = document.getElementById('results');
const statsCount = document.getElementById('statsCount');

function highlight(text, query) {
  if (!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
}

function matchesFilter(v) {
  if (currentFilter === 'all') return true;
  if (currentFilter === 'irregular') return v.type === 'irregular';
  if (currentFilter === 'regular') return v.type === 'regular';
  if (currentFilter === 'id') return v.sound === 'id';
  if (currentFilter === 't') return v.sound === 't';
  if (currentFilter === 'd') return v.sound === 'd';
  return true;
}

function matchesQuery(v, q) {
  if (!q) return true;
  const lq = q.toLowerCase();
  return [v.base, v.past, v.participle, v.esPres, v.esPast, v.esPart].some(f =>
    f.toLowerCase().includes(lq)
  );
}

function render() {
  const q = currentQuery.trim();
  const filtered = VERBS.filter(v => matchesFilter(v) && matchesQuery(v, q));

  const total = VERBS.filter(matchesFilter).length;
  statsCount.innerHTML = q
    ? `<strong>${filtered.length}</strong> resultado${filtered.length !== 1 ? 's' : ''} de <strong>${total}</strong>`
    : `<strong>${total}</strong> verbo${total !== 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    results.innerHTML = `
      <div class="no-results">
        <div class="emoji">🔎</div>
        <h3>No se encontraron verbos</h3>
        <p>Prueba con otra palabra en inglés o español</p>
      </div>`;
    return;
  }

  results.innerHTML = filtered.map((v, i) => {
    const isIrreg = v.type === 'irregular';
    const soundLabel = v.sound ? (v.sound === 'id' ? '/id/' : v.sound === 't' ? '/t/' : '/d/') : '';
    const delay = Math.min(i * 30, 300);

    const typeBadge = isIrreg
      ? `<span class="badge badge-irreg">Irregular</span>`
      : `<span class="badge badge-reg">Regular</span>`;

    const soundBadge = soundLabel
      ? `<span class="badge badge-sound">${soundLabel} sound</span>`
      : '';

    const hBase  = highlight(v.base, q);
    const hPast  = highlight(v.past, q);
    const hPart  = highlight(v.participle, q);
    const hPres  = highlight(v.esPres, q);
    const hEsPast = highlight(v.esPast, q);
    const hEsPart = highlight(v.esPart, q);

    return `
    <div class="verb-card" style="animation-delay:${delay}ms">
      <div class="card-top">
        <div>
          <div class="infinitive-word">${hBase}</div>
          <div class="spanish-word">${hPres}</div>
        </div>
        <div class="badge-wrap">
          ${typeBadge}
          ${soundBadge}
        </div>
      </div>
      <div class="card-forms">
        <div class="form-cell">
          <div class="form-label">Base Form</div>
          <div class="form-en">${hBase}</div>
          <div class="form-es">${hPres}</div>
        </div>
        <div class="form-cell">
          <div class="form-label">Simple Past</div>
          <div class="form-en">${hPast}</div>
          <div class="form-es">${hEsPast}</div>
        </div>
        <div class="form-cell">
          <div class="form-label">Past Participle</div>
          <div class="form-en">${hPart}</div>
          <div class="form-es">${hEsPart}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// Events
input.addEventListener('input', () => {
  currentQuery = input.value;
  clearBtn.style.display = currentQuery ? 'block' : 'none';
  checkEasterEgg(currentQuery.trim());
  render();
});

clearBtn.addEventListener('click', () => {
  input.value = '';
  currentQuery = '';
  clearBtn.style.display = 'none';
  input.focus();
  render();
});

document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    currentFilter = pill.dataset.filter;
    render();
  });
});

// Easter Eggs
const _e = [
  {k:"eddy",   n:"Eddy",     i:"📖", m:'Proverbios 27:17\n\n"Ves… ese es el sonido del que le hablé, el famoso schwa" 😂'},
  {k:"mari",   n:"Mari",     i:"🎵", m:"Recomiéndeme una canción de esas de reggaeton viejito de las que me habló. 🎶"},
  {k:"naty",   n:"Naty",     i:"🇫🇷", m:'"Le français est facile."\n\nNaty, hackear sistemas es muy divertido, no me aliente 😂'},
  {k:"angelica",n:"Angélica",i:"🏆", m:"Asistencia perfecta 100% ✅"},
  {k:"michelle",n:"Michelle",i:"✈️", m:"Aprenda a usar paracaídas por si el avión se cae 😂"},
  {k:"arturo", n:"Arturo",   i:"📚", m:"No voy a hablar de otro tema que no sea de la práctica, se lo prometo 😂"},
  {k:"joss",   n:"Joss",     i:"🐱", m:"Joss cierre la ventana, cuidado se escapa la gata otra vez.\n\nEsperó que la pata de su perrito esté mejor 🐾"},
  {k:"nicole", n:"Nicole",   i:"📝", m:"Nicole, mañana hay exposición, espero esté preparada. ¡Pilas! ⚡"},
  {k:"eli",    n:"Eli",      i:"🐻", m:"Eli, gracias por la ayuda, siempre me estás ayudando. 💛\n\nSi ves al Oso Yogui me lo saluda 😂"},
];

let _shown = false;

function checkEasterEgg(q) {
  if (!q) { _shown = false; return; }
  const egg = _e.find(e => e.k === q.toLowerCase().trim());
  if (egg && !_shown) { _shown = true; showEgg(egg); }
  else if (!egg) { _shown = false; }
}

function showEgg(egg) {
  document.getElementById('eggEmoji').textContent = egg.i;
  document.getElementById('eggName').textContent = egg.n;
  document.getElementById('eggMsg').innerHTML = egg.m.replace(/\n/g, '<br>');
  document.getElementById('eggOverlay').classList.add('visible');
}

document.getElementById('eggClose').addEventListener('click', () => {
  document.getElementById('eggOverlay').classList.remove('visible');
});

document.getElementById('eggOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('eggOverlay'))
    document.getElementById('eggOverlay').classList.remove('visible');
});

render();
</script>
</body>
